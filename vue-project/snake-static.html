<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>貪食蛇 Snake Game — Static Prototype</title>
    <style>
        /* ---- Reset & Page ---- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f23;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        /* ---- Game Panel ---- */
        .game-container {
            background: #16213e;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #e0e0e0;
        }
        .score { font-size: 24px; font-weight: bold; color: #4fc3f7; }
        canvas {
            border: 2px solid #0f3460;
            border-radius: 4px;
            background: #1e2a4a;
            display: block;
        }
        .controls {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        button {
            padding: 10px 28px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start { background: #4fc3f7; color: #0a0a23; }
        .btn-start:hover { background: #29b6f6; }
        .btn-reset { background: #e57373; color: #fff; }
        .btn-reset:hover { background: #ef5350; }
        .status { color: #ffd54f; margin-top: 12px; font-size: 18px; }
    </style>
</head>
<body>
    <!-- Game UI: HUD, canvas, controls -->
    <div class="game-container">
        <div class="header">
            <span class="score">分數: <span id="scoreDisplay">0</span></span>
            <span id="statusDisplay" class="status">按「開始」遊玩</span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button class="btn-start" id="startBtn">開始</button>
            <button class="btn-reset" id="resetBtn">重置</button>
        </div>
        <div style="color:#888; margin-top:12px; font-size:14px;">
            WASD / 方向鍵 控制移動
        </div>
    </div>

    <script>
        // ---- Grid Constants ----
        const GRID_SIZE = 20;
        const CELL_SIZE = 20;
        const CANVAS_SIZE = GRID_SIZE * CELL_SIZE;

        // ---- DOM Refs ----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const statusSpan = document.getElementById('statusDisplay');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ---- State ----
        let snake = [];
        let food = null;
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameStatus = 'idle';  // idle / playing / gameover
        let gameInterval = null;

        // ---- Init ----
        function initGame() {
            const startX = Math.floor(GRID_SIZE / 2);
            const startY = Math.floor(GRID_SIZE / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY },
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            updateScore();
            generateFood();
            gameStatus = 'idle';
            statusSpan.textContent = '按「開始」遊玩';
            draw();
        }

        // ---- Food (single item at a random free cell) ----
        function generateFood() {
            const totalCells = GRID_SIZE * GRID_SIZE;
            if (snake.length >= totalCells) {
                food = null;
                return;
            }
            const snakeSet = new Set(snake.map(s => `${s.x},${s.y}`));
            let freeCells = [];
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let y = 0; y < GRID_SIZE; y++) {
                    if (!snakeSet.has(`${x},${y}`)) {
                        freeCells.push({ x, y });
                    }
                }
            }
            food = freeCells[Math.floor(Math.random() * freeCells.length)];
        }

        function updateScore() {
            scoreSpan.textContent = score;
        }

        // ---- Rendering ----
        function draw() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Grid lines
            ctx.strokeStyle = '#4a6a8a';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * CELL_SIZE);
                ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE);
                ctx.stroke();
            }

            // Snake body (head brighter, body darker)
            snake.forEach((seg, i) => {
                const isHead = i === 0;
                ctx.fillStyle = isHead ? '#4fc3f7' : '#26a69a';
                ctx.shadowColor = isHead ? '#4fc3f7' : '#26a69a';
                ctx.shadowBlur = isHead ? 8 : 4;
                ctx.fillRect(seg.x * CELL_SIZE + 1, seg.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                ctx.shadowBlur = 0;
            });

            // Food (red circle with glow)
            if (food) {
                ctx.fillStyle = '#ef5350';
                ctx.shadowColor = '#ef5350';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                const cx = food.x * CELL_SIZE + CELL_SIZE / 2;
                const cy = food.y * CELL_SIZE + CELL_SIZE / 2;
                ctx.arc(cx, cy, CELL_SIZE / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ---- Game Tick ----
        function move() {
            direction = { ...nextDirection };
            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y,
            };

            // Wall collision
            if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
                gameOver();
                return;
            }

            // Self collision
            for (const seg of snake) {
                if (seg.x === newHead.x && seg.y === newHead.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(newHead);

            // Eat food → grow, otherwise remove tail
            if (food && newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                updateScore();
                generateFood();
                if (!food) {
                    gameStatus = 'idle';
                    clearInterval(gameInterval);
                    gameInterval = null;
                    statusSpan.textContent = '🎉 你贏了！';
                    startBtn.textContent = '開始';
                }
            } else {
                snake.pop();
            }

            draw();
        }

        // ---- Lifecycle ----
        function gameOver() {
            gameStatus = 'gameover';
            clearInterval(gameInterval);
            gameInterval = null;
            statusSpan.textContent = '💀 遊戲結束';
            startBtn.textContent = '重新開始';
            draw();
        }

        function startGame() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            if (gameStatus === 'gameover' || gameStatus === 'idle') {
                initGame();
            }
            gameStatus = 'playing';
            startBtn.textContent = '進行中';
            statusSpan.textContent = '▶ 遊玩中';
            gameInterval = setInterval(move, 150);
        }

        function resetGame() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            initGame();
            startBtn.textContent = '開始';
        }

        // ---- Input ----
        function changeDirection(newDir) {
            if (gameStatus !== 'playing') return;
            const opposite =
                direction.x + newDir.x === 0 && direction.y + newDir.y === 0;
            if (!opposite) {
                nextDirection = newDir;
            }
        }

        // Keyboard: WASD / arrows to steer, Space to start
        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    changeDirection({ x: 0, y: -1 });
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    changeDirection({ x: 0, y: 1 });
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    changeDirection({ x: -1, y: 0 });
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    changeDirection({ x: 1, y: 0 });
                    break;
                case ' ':
                    e.preventDefault();
                    if (gameStatus === 'idle' || gameStatus === 'gameover') {
                        startGame();
                    }
                    break;
            }
        });

        // Button click handlers
        startBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', resetGame);

        // Boot
        initGame();
    </script>
</body>
</html>
